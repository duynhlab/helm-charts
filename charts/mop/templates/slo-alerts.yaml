{{- if .Values.slo.enabled }}
{{- /*
Burn-rate alerts for the SLOs in slo.yaml, emitted here instead of by Sloth.

Sloth still owns the SLIs and every recording rule, so the error budget and the
SLO dashboards are unchanged; slo.yaml only sets pageAlert/ticketAlert
`disable: true`. These rules repeat Sloth's own multi-window expressions (the
names, labels and annotations Sloth would have generated) and add ONE thing
Sloth v0.16 has no field for: a minimum number of requests in each arm's long
window (`slo.minEvents`).

Why: a ratio over a handful of requests is not a burn rate. On an idle cluster
3 slow requests out of 8 in six hours paged CheckoutHighLatency. Below
minEvents one request moves the ratio by more than 1/minEvents, so the arm
stays silent; the ticket arms (1d / 3d long windows) still catch a sustained
problem on a low-traffic service.

The `max(...) without (sloth_window)` keeps sloth_id / sloth_slo /
sloth_service on the result, so Alertmanager routes and inhibitions that match
them keep working.
*/}}
{{- $root := . }}
{{- $ns := include "mop.namespace" . }}
{{- $total := printf "http_server_request_duration_seconds_count{app=%q, namespace=%q}" .Values.name $ns }}
{{- $slos := list
  (dict "slo" "availability" "objective" .Values.slo.availability.objective "alert" (printf "%sHighErrorRate" (.Values.name | title)) "category" "availability" "summary" (printf "High 5xx error rate detected on %s" .Values.name) "description" (printf "Availability SLO is at risk. Current error rate is impacting %s service availability." .Values.name))
  (dict "slo" "latency" "objective" .Values.slo.latency.objective "alert" (printf "%sHighLatency" (.Values.name | title)) "category" "latency" "summary" (printf "High latency detected on %s" .Values.name) "description" (printf "More than %d%% of requests are slower than %ss threshold." (sub 100 (int .Values.slo.latency.objective)) .Values.slo.latency.threshold))
}}
{{- /* severity, channel, then two arms of (factor, short, long) — Sloth's defaults for a 30d period */}}
{{- $tiers := list
  (dict "severity" "page" "channel" "#alerts" "arms" (list (list "14.4" "5m" "1h") (list "6" "30m" "6h")))
  (dict "severity" "ticket" "channel" "#incidents" "arms" (list (list "3" "2h" "1d") (list "1" "6h" "3d")))
}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mop.fullname" . }}-slo-alerts
  namespace: {{ .Values.slo.namespace | default "monitoring" }}
  labels:
    {{- include "mop.labels" . | nindent 4 }}
spec:
  groups:
    {{- range $s := $slos }}
    {{- $id := printf "%s-%s" $root.Values.name $s.slo }}
    - name: slo-alerts-{{ $id }}
      rules:
        {{- range $t := $tiers }}
        - alert: {{ $s.alert }}
          expr: |
            {{- range $i, $arm := $t.arms }}
            {{- $sel := printf "{sloth_id=%q, sloth_service=%q, sloth_slo=%q}" $id $root.Values.name $s.slo }}
            {{- if $i }}
            or
            {{- end }}
            (
                max(slo:sli_error:ratio_rate{{ index $arm 1 }}{{ $sel }} > ({{ index $arm 0 }} * (1 - {{ $s.objective }} / 100))) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate{{ index $arm 2 }}{{ $sel }} > ({{ index $arm 0 }} * (1 - {{ $s.objective }} / 100))) without (sloth_window)
                and on()
                sum(increase({{ $total }}[{{ index $arm 2 }}])) >= {{ $root.Values.slo.minEvents }}
            )
            {{- end }}
          labels:
            severity: {{ $t.severity }}
            sloth_severity: {{ $t.severity }}
            channel: {{ $t.channel | quote }}
            category: {{ $s.category }}
            service: {{ $root.Values.name | quote }}
          annotations:
            title: "({{ $t.severity }}) {{`{{$labels.sloth_service}} {{$labels.sloth_slo}}`}} SLO error budget burn rate is too fast."
            summary: {{ $s.summary | quote }}
            description: {{ $s.description | quote }}
        {{- end }}
    {{- end }}
{{- end }}
