{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "duynh.fullname" . }}
  labels:
    {{- include "duynh.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- range .Values.service.extraPorts }}
    - name: {{ required "service.extraPorts[].name is required" .name }}
      port: {{ required "service.extraPorts[].port is required" .port }}
      targetPort: {{ .targetPort | default .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  selector:
    {{- include "duynh.selectorLabels" . | nindent 4 }}
{{- end }}
