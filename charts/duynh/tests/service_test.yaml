suite: service
templates:
  - service.yaml
release:
  name: test
  namespace: apps
tests:
  - it: exposes the named HTTP container port
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: test

  - it: renders extra ports, targeting the port name by default
    set:
      service.extraPorts:
        - name: grpc
          port: 9090
    asserts:
      - equal:
          path: spec.ports[1]
          value:
            name: grpc
            port: 9090
            targetPort: grpc
            protocol: TCP

  - it: is absent when service.enabled is false
    set:
      service.enabled: false
    asserts:
      - hasDocuments:
          count: 0
