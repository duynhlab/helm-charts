suite: service account
templates:
  - serviceaccount.yaml
release:
  name: test
  namespace: apps
tests:
  - it: disables API token mounting by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: is absent when creation is disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
