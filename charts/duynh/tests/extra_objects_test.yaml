suite: extra objects
templates:
  - extra-objects.yaml
release:
  name: test
  namespace: apps
tests:
  - it: is absent by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a map through tpl
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-extra"
          data:
            namespace: "{{ .Release.Namespace }}"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-extra
      - equal:
          path: data.namespace
          value: apps

  - it: renders a string through tpl
    set:
      extraObjects:
        - |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ .Release.Name }}-raw
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-raw
