replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# Name of the main container; defaults to the chart name.
containerName: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}
# Added to the Deployment selector and the pod labels. The selector is
# immutable, so set this only to keep an existing selector when adopting
# a workload from another chart.
extraSelectorLabels: {}

podSecurityContext: {}
securityContext: {}

containerPort: 80
# Additional named container ports, e.g. [{name: grpc, containerPort: 9090}].
extraPorts: []
command: []
args: []
env: []
envFrom: []
# Init containers, rendered through tpl (e.g. a schema migration).
initContainers: []

service:
  enabled: true
  type: ClusterIP
  port: 80
  # appProtocol of the http port (e.g. http, h2c); empty leaves it unset.
  appProtocol: ""
  annotations: {}
  # Additional ports, e.g. [{name: grpc, port: 9090, appProtocol: grpc}].
  extraPorts: []

sloth:
  enabled: false
  # Namespace for the PrometheusServiceLevel; defaults to the release
  # namespace. Set it when the Sloth operator watches one namespace only.
  namespace: ""
  annotations: {}
  service: ""
  labels: {}
  slos: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

startupProbe: {}
livenessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
  failureThreshold: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: null
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

terminationGracePeriodSeconds: 30

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Extra manifests rendered with the release, each through tpl (maps or strings).
extraObjects: []
