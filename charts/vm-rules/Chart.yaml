apiVersion: v2
name: vm-rules
description: |
  Static VictoriaMetrics alerting rules packaged as VMRule custom resources.
  Each rule group ships as a standalone Prometheus rule file and renders into
  one VMRule, discovered by VMAlert through its ruleSelector.
type: application
deprecated: false
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - observability
  - victoriametrics
  - vmalert
  - vmrule
  - alerting
  - prometheus
  - monitoring
  - kubernetes
maintainers:
  - name: duynhlab
    url: https://github.com/duynhlab
home: https://github.com/duynhlab/helm-charts
sources:
  - https://github.com/duynhlab/helm-charts
