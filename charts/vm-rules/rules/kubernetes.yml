# Workload-level resource pressure, from cadvisor and kube-state-metrics.
groups:
  - name: kubernetes.rules
    rules:
      - alert: PodOOMKilled
        expr: kube_pod_container_status_terminated_reason{reason="OOMKilled"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Pod was OOM killed
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOM killed.

      - alert: PodMemoryLimit
        expr: irate(container_memory_failcnt{container!=""}[5m]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pod reached its memory limit
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} keeps hitting its memory limit.

      - alert: PodMemoryResourcesAboveRequested
        expr: >-
          topk by (cluster, namespace, pod, container) (10,
          (max by (cluster, namespace, pod, container) (container_memory_working_set_bytes{container!=""})
          - max by (cluster, namespace, pod, container) (kube_pod_container_resource_requests{resource="memory",unit="byte"}))
          > 100 * 1024 * 1024)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pod memory usage is above its request
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} uses {{ $value | humanize1024 }}B more memory than requested.

      - alert: PodCPULimit
        expr: >-
          (sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
          / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="cpu"})) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pod reached its CPU limit
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} is at {{ $value | humanizePercentage }} of its CPU limit.

      - alert: PodCPUResourcesAboveRequested
        expr: >-
          topk by (cluster, namespace, pod, container) (10,
          (max by (cluster, namespace, pod, container) (irate(container_cpu_usage_seconds_total{container!=""}[5m]))
          - max by (cluster, namespace, pod, container) (kube_pod_container_resource_requests{resource="cpu",unit="core"}))
          > 0.2)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pod CPU usage is above its request
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} uses {{ $value }} cores more than requested.
