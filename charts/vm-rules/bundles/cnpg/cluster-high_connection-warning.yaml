# Generated from cnpg/cluster chart v0.6.0 (helm template) with fullnameOverride=@@CNPG_CLUSTER@@, namespace=product.
# Do not edit expr by hand; re-render from chart and split, or bump chart version in README.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: @@CNPG_CLUSTER@@-cluster-high-connection-warning
  namespace: @@CNPG_NAMESPACE@@
  labels:
    app.kubernetes.io/part-of: cnpg-chart-rules
    cnpg.io/cluster: @@CNPG_CLUSTER@@
    platform.duynhlab.dev/source: cloudnative-pg-charts-cluster
    platform.duynhlab.dev/chart-version: 0.6.0
spec:
  groups:
  - name: cloudnative-pg/@@CNPG_CLUSTER@@
    rules:
    - alert: CNPGClusterHighConnectionsWarning
      annotations:
        summary: CNPG Instance is approaching the maximum number of connections.
        description: 'CloudNativePG Cluster "@@CNPG_NAMESPACE@@/@@CNPG_CLUSTER@@" instance {{ $labels.pod }} is using {{ $value }}% of

          the maximum number of connections.'
        runbook_url: https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/postgresql/CNPGClusterHighConnectionsWarning.md
      expr: sum by (pod) (cnpg_backends_total{namespace="@@CNPG_NAMESPACE@@", pod=~"@@CNPG_CLUSTER@@-([1-9][0-9]*)$"}) / max by (pod) (cnpg_pg_settings_setting{name="max_connections", namespace="@@CNPG_NAMESPACE@@", pod=~"@@CNPG_CLUSTER@@-([1-9][0-9]*)$"}) * 100 > 80
      for: 5m
      labels:
        severity: warning
        namespace: @@CNPG_NAMESPACE@@
        cnpg_cluster: @@CNPG_CLUSTER@@
