# CNPG-only: not part of chart prometheus_rules fragments; kept from legacy postgres-alerts split.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: @@CNPG_CLUSTER@@-cluster-fenced
  namespace: @@CNPG_NAMESPACE@@
  labels:
    app.kubernetes.io/part-of: cnpg-chart-rules
    cnpg.io/cluster: @@CNPG_CLUSTER@@
spec:
  groups:
    - name: cloudnative-pg/@@CNPG_CLUSTER@@-fenced
      interval: 1m
      rules:
        - alert: CnpgClusterFenced
          expr: cnpg_collector_fencing_on{namespace="@@CNPG_NAMESPACE@@"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "CNPG cluster fenced ({{ $labels.namespace }}/{{ $labels.cluster }})"
            description: "CloudNativePG cluster is fenced. All write operations are blocked."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/postgresql/CnpgClusterFenced.md"
