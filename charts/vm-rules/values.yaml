nameOverride: ""
fullnameOverride: ""

# -- Keep the original six rule groups available without changing existing installs.
defaultRules:
  enabled: true

# -- Opt-in homelab rule bundles. These preserve the validated homelab expressions;
# jobNames only affects the original rules map below, not these bundles.
bundles:
  kubernetes: {enabled: false}
  microservices: {enabled: false}
  envoy-gateway: {enabled: false}
  keycloak: {enabled: false}
  victoriametrics: {enabled: false}
  observability: {enabled: false}
  valkey: {enabled: false}
  gitops: {enabled: false}
  kyverno: {enabled: false}
  keda: {enabled: false}
  postgres: {enabled: false}
  watchdog: {enabled: false}
  temporal: {enabled: false}

# -- Each configured cluster gets the 15 active CNPG rules. Namespace is required.
# haExcludedJob only excludes a deliberately single-instance job from HA alerts.
cnpg:
  clusters: {}
    # product-db:
    #   namespace: product
    #   haExcludedJob: product/product-db-replica
    # platform-db:
    #   namespace: platform
  operator:
    enabled: false
    namespace: cloudnative-pg

# -- Additional VMRule objects keyed by name suffix. No Helm tpl evaluation.
# Each entry accepts groups (required), namespace (defaults to release namespace),
# labels and annotations (resource metadata, not alert labels).
extraRules: {}

# -- (map) Labels added to every VMRule so VMAlert's `ruleSelector` can discover
# them. Leave empty when VMAlert uses `ruleSelector: {}` (selects everything).
ruleSelectorLabels: {}
  # app.kubernetes.io/part-of: victoria-metrics

# -- (map) Remap the job names the bundled rules match on. Key = job name as
# written in rules/*.yml, value = the job name your scrape config actually
# produces. Leave empty when the defaults already match.
# Find your real job names with:
#   count by (job) (rest_client_requests_total)
#   count by (job) (node_time_seconds)
jobNames: {}
  # kubelet: kubernetes-nodes
  # node-exporter: prom-stack-prometheus-node-exporter

# -- Rule groups. Each entry renders one VMRule from the matching file under `rules/`.
rules:
  certmanager:
    # -- (bool) Enable or disable this rule group
    enabled: true
    # -- (string) Rule file path under rules/
    file: certmanager.yml
    # -- (map) Additional labels for this VMRule
    labels: {}
    # -- (map) Additional annotations for this VMRule
    annotations: {}

  fluxcd:
    enabled: true
    file: fluxcd.yml
    labels: {}
    annotations: {}

  kubelet:
    enabled: true
    file: kubelet.yml
    labels: {}
    annotations: {}

  kubernetes:
    enabled: true
    file: kubernetes.yml
    labels: {}
    annotations: {}

  node-exporter:
    enabled: true
    file: node-exporter.yml
    labels: {}
    annotations: {}

  # Not every cluster runs redis_exporter, so this group is opt-in.
  redis:
    enabled: false
    file: redis.yml
    labels: {}
    annotations: {}
