name: Release Helm Charts
run-name: 📦 Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

permissions:
  contents: read
  packages: write # publish chart to ghcr.io

jobs:
  release-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v5
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 #v5.0.0
        with:
          version: v3.9.0

      # Publish OCI charts to ghcr.io
      - name: Generate charts
        run: |
          mkdir -p .cr-release-packages
          for d in charts/* ; do
            helm package "$d" --destination .cr-release-packages
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Charts to OCI
        run: |
          set -euo pipefail
          for pkg in .cr-release-packages/*; do
            [ -e "$pkg" ] || continue
            name=$(basename "$pkg" .tgz)       # e.g. duynh-0.2.1
            chart="${name%-*}"                  # e.g. duynh
            version="${name##*-}"               # e.g. 0.2.1

            # Skip if this version already exists in GHCR.
            if helm show chart "oci://ghcr.io/duynhlab/helm-charts/${chart}" --version "${version}" >/dev/null 2>&1; then
              echo "SKIP ${chart}-${version} (already published)"
              continue
            fi

            echo "PUSH ${pkg}"
            helm push "${pkg}" oci://ghcr.io/duynhlab/helm-charts
          done
