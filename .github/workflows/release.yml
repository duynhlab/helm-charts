name: Release Helm Charts
run-name: 📦 Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

permissions:
  contents: read
  packages: write # publish chart to ghcr.io

jobs:
  release-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v5
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 #v5.0.0
        with:
          version: v3.9.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Package each chart, then push only versions that don't already exist
      # on GHCR. helm push fails with 409 Conflict if the version is already
      # published, so skip those to keep the workflow green on every push.
      - name: Package and publish charts
        env:
          OCI_REGISTRY: ghcr.io/duynhlab/helm-charts
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          for d in charts/*/; do
            chart_name=$(basename "$d")
            version=$(helm show chart "$d" | awk '$1 == "version:" { print $2 }')
            echo "== ${chart_name} ${version} =="
            # Check if this version already exists in the registry.
            if helm show chart "oci://${OCI_REGISTRY}/${chart_name}" --version "${version}" >/dev/null 2>&1; then
              echo "  SKIP: ${chart_name}-${version} already published"
              continue
            fi
            helm package "$d" --destination .cr-release-packages
            echo "  PUSH: ${chart_name}-${version}"
            helm push ".cr-release-packages/${chart_name}-${version}.tgz" "oci://${OCI_REGISTRY}"
          done
