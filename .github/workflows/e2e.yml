name: E2E (KinD)
run-name: 🧪 E2E (KinD)

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/e2e.yml'
      - '.github/configs/ct.yaml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: [v1.35.8, v1.36.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/configs/ct.yaml)
          if [ -n "$changed" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Create KinD cluster (${{ matrix.k8s-version }})
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:${{ matrix.k8s-version }}

      # charts/vm-rules renders VMRule objects, so the CRDs must exist before
      # ct installs it. Server-side apply: the bundle is ~9MB, over the
      # client-side last-applied-configuration annotation limit.
      - name: Install VictoriaMetrics operator CRDs
        if: steps.list-changed.outputs.changed == 'true'
        env:
          VM_OPERATOR_VERSION: v0.74.1
        run: |
          kubectl apply --server-side --force-conflicts -f "https://github.com/VictoriaMetrics/operator/releases/download/${VM_OPERATOR_VERSION}/crd.yaml"
          kubectl wait --for condition=established --timeout=60s crd/vmrules.operator.victoriametrics.com

      # charts/slo and the duynh ci/monitoring-values.yaml render a Sloth
      # PrometheusServiceLevel and a PrometheusRule. Versions match the homelab
      # cluster: prometheus-operator-crds 32.0.1 (operator v0.94.1), Sloth v0.16.0.
      - name: Install Prometheus Operator and Sloth CRDs
        if: steps.list-changed.outputs.changed == 'true'
        env:
          PROM_CRDS_VERSION: 32.0.1
          SLOTH_VERSION: v0.16.0
        run: |
          helm install prometheus-operator-crds \
            oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds \
            --version "${PROM_CRDS_VERSION}"
          kubectl apply --server-side -f "https://raw.githubusercontent.com/slok/sloth/${SLOTH_VERSION}/pkg/kubernetes/gen/crd/sloth.slok.dev_prometheusservicelevels.yaml"
          # A CRD created a moment ago has no .status.conditions yet, and
          # kubectl wait errors on that instead of waiting, so retry briefly.
          for i in $(seq 1 30); do
            kubectl wait --for condition=established --timeout=10s \
              crd/prometheusrules.monitoring.coreos.com \
              crd/prometheusservicelevels.sloth.slok.dev && break
            [ "$i" -eq 30 ] && exit 1
            sleep 2
          done

      - name: Lint + install changed charts on KinD (+ helm test)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint-and-install --config .github/configs/ct.yaml
